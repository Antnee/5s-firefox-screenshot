<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Camera body -->
  <rect x="8" y="32" width="112" height="80" rx="10" fill="#4a5568"/>
  <!-- Camera grip texture -->
  <rect x="10" y="40" width="8" height="64" rx="2" fill="#2d3748"/>
  <!-- Camera lens mount -->
  <circle cx="64" cy="72" r="32" fill="#2d3748"/>
  <!-- Camera lens outer ring -->
  <circle cx="64" cy="72" r="26" fill="#4299e1"/>
  <!-- Camera lens middle -->
  <circle cx="64" cy="72" r="18" fill="#3182ce"/>
  <!-- Camera lens inner -->
  <circle cx="64" cy="72" r="10" fill="#2b6cb0"/>
  <!-- Camera lens center -->
  <circle cx="64" cy="72" r="4" fill="#1a365d"/>
  <!-- Camera lens highlight -->
  <circle cx="54" cy="62" r="6" fill="#bee3f8" opacity="0.6"/>
  <circle cx="50" cy="58" r="2" fill="#ffffff" opacity="0.8"/>
  <!-- Camera flash -->
  <rect x="88" y="40" width="20" height="10" rx="2" fill="#ecc94b"/>
  <!-- Camera flash detail -->
  <rect x="90" y="42" width="16" height="6" rx="1" fill="#f6e05e"/>
  <!-- Camera viewfinder bump -->
  <path d="M40 32 L40 20 A4 4 0 0 1 44 16 L84 16 A4 4 0 0 1 88 20 L88 32" fill="#4a5568"/>
  <!-- Viewfinder window -->
  <rect x="50" y="20" width="28" height="8" rx="2" fill="#2d3748"/>
  <!-- Number 5 badge -->
  <circle cx="104" cy="32" r="24" fill="#e53e3e"/>
  <circle cx="104" cy="32" r="21" fill="#c53030"/>
  <text x="104" y="44" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">5</text>
</svg>

