<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Camera body -->
  <rect x="2" y="8" width="28" height="20" rx="3" fill="#4a5568"/>
  <!-- Camera lens mount -->
  <circle cx="16" cy="18" r="8" fill="#2d3748"/>
  <!-- Camera lens outer -->
  <circle cx="16" cy="18" r="6" fill="#4299e1"/>
