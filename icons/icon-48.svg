<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Camera body -->
  <rect x="3" y="12" width="42" height="30" rx="4" fill="#4a5568"/>
  <!-- Camera lens mount -->
  <circle cx="24" cy="27" r="12" fill="#2d3748"/>
  <!-- Camera lens outer -->
  <circle cx="24" cy="27" r="9" fill="#4299e1"/>
  <!-- Camera lens inner -->
  <circle cx="24" cy="27" r="5" fill="#2b6cb0"/>
  <!-- Camera lens highlight -->
  <circle cx="21" cy="24" r="2" fill="#bee3f8" opacity="0.7"/>
  <!-- Camera flash -->
  <rect x="33" y="15" width="8" height="4" rx="1" fill="#ecc94b"/>
  <!-- Camera viewfinder bump -->
  <path d="M15 12 L15 7.5 A1.5 1.5 0 0 1 16.5 6 L31.5 6 A1.5 1.5 0 0 1 33 7.5 L33 12" fill="#4a5568"/>
  <!-- Number 5 badge -->
  <circle cx="39" cy="12" r="9" fill="#e53e3e"/>
  <text x="39" y="16.5" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">5</text>
</svg>

